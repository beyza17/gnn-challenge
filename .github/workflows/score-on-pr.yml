name: Score Submission on PR

on:
  pull_request:
    paths:
      - 'submissions/*.csv'
    branches: [ main ]

jobs:
  score-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas scikit-learn

      - name: Find submitted CSV
        id: find_csv
        run: |
          # Get all CSV files in submissions/
          CSV_FILES=$(find submissions -name "*.csv" -type f)
          if [ -z "$CSV_FILES" ]; then
            echo "No CSV files found in submissions/"
            exit 1
          fi
          
          # Get the most recent CSV file
          CSV_FILE=$(echo "$CSV_FILES" | head -n 1)
          echo "csv_file=$CSV_FILE" >> $GITHUB_OUTPUT
          echo "Found CSV: $CSV_FILE"

      - name: Run scoring
        id: scoring
        run: |
          # Run scoring script
          python scoring_script.py "${{ steps.find_csv.outputs.csv_file }}"
          
          # Read the score
          if [ -f "score.txt" ]; then
            SCORE=$(cat score.txt)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "Score: $SCORE"
            
            # Also save score to file for the merge workflow
            echo "${{ github.event.pull_request.user.login }},$SCORE" > pr_score.txt
          else
            echo "score.txt not found!"
            exit 1
          fi

      - name: Post score as PR comment
        uses: actions/github-script@v6
        env:
          SCORE: ${{ steps.scoring.outputs.score }}
          USERNAME: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const score = process.env.SCORE;
            const username = process.env.USERNAME;
            
            // Delete previous bot comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('🎯')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }
            
            // Create new comment
            const comment = `🎯 **Submission Evaluated Successfully!**\n\n` +
                           `**User:** ${username}\n` +
                           `**Score:** ${score}\n\n` +
                           `✅ **Ready to merge!** The leaderboard will update automatically once merged.`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });