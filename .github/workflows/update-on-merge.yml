name: Auto Update Leaderboard on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'submissions/*.csv'

jobs:
  update-leaderboard:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # FIX 1: Added cryptography
      - name: Install dependencies
        run: pip install pandas scikit-learn cryptography

      - name: Get PR info
        id: pr_info
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT

      - name: Get submitted CSV from merged commit
        id: find_csv
        run: |
          git checkout ${{ steps.pr_info.outputs.merge_sha }}
          
          CSV_FILES=$(find submissions -name "*.csv" -type f)
          if [ -z "$CSV_FILES" ]; then
            echo "No CSV files found in merged commit!"
            exit 1
          fi
          
          USER_CSV=$(echo "$CSV_FILES" | grep -i "${{ steps.pr_info.outputs.pr_author }}" | head -n 1)
          
          if [ -n "$USER_CSV" ]; then
            CSV_FILE="$USER_CSV"
          else
            CSV_FILE=$(echo "$CSV_FILES" | head -n 1)
          fi
          
          echo "csv_file=$CSV_FILE" >> $GITHUB_OUTPUT
          
          # Go back to main branch to run scoring scripts (ensure scripts are up to date)
          git checkout main

      - name: Run scoring (on merged submission)
        id: scoring
        # FIX 2: Passed the secret
        env:
          DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
        run: |
          # We need the CSV file from the checkout, but the scripts from main
          # We extract the CSV content from the merge commit temporarily or assume it exists 
          # Note: Since we checked out main in the previous step, the CSV from the merge might be gone if it's new
          # Better approach: Checkout the file specifically
          
          git checkout ${{ steps.pr_info.outputs.merge_sha }} -- "${{ steps.find_csv.outputs.csv_file }}"
          
          python scoring_script.py "${{ steps.find_csv.outputs.csv_file }}"
          
          if [ -f "score.txt" ]; then
            SCORE=$(cat score.txt)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
          else
            echo "score=0.0" >> $GITHUB_OUTPUT
          fi
          
          # Reset to main state for leaderboard update
          git checkout main -- .

      - name: Update leaderboard
        run: |
          python update_leaderboard.py "github_${{ steps.pr_info.outputs.pr_author }}" "${{ steps.scoring.outputs.score }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet leaderboard.md; then
            echo "No changes to leaderboard"
          else
            git add leaderboard.md
            git commit -m "📊 Auto-update leaderboard: github_${{ steps.pr_info.outputs.pr_author }} - ${{ steps.scoring.outputs.score }}"
            git push
          fi